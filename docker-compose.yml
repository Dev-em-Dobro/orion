# Dev local. Sobe com: docker compose up -d
#
# - postgres  → banco do Orion (o de produção é o Neon; aqui é só local)
# - mailpit   → caixa de entrada falsa pro magic link (ADR-010 / F014)
#               UI: http://127.0.0.1:8025 · SMTP: 1025
#
# Guia completo em docs/DEV-LOCAL.md

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: orion
    ports:
      - "5432:5432"
    volumes:
      - orion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  orion-pgdata:
